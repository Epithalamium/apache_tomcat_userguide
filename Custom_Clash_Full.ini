[custom]
; URLtest.txt 主幹精簡整合版
; 保留原有 Fallback + 地區 URL-Test 架構
; 規則主要取自 Custom_Clash_Full.ini，移除原 txt 中較舊/重複的 Surge 規則

enable_rule_generator=true
overwrite_original_rules=true

; ==================== 規則 ====================

; 本地 / 國內直連
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical.yaml,28800
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; 自訂代理規則
ruleset=Proxies,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=Proxies,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; 通訊 / 社交 / AI / 開發
ruleset=Proxies,[]GEOSITE,category-communication
ruleset=Proxies,[]GEOSITE,category-social-media-!cn
ruleset=Proxies,[]GEOSITE,openai
ruleset=Proxies,[]GEOSITE,bing
ruleset=Proxies,[]GEOSITE,category-ai-!cn
ruleset=Proxies,[]GEOSITE,github
ruleset=Proxies,[]GEOSITE,category-dev
ruleset=Proxies,[]GEOSITE,category-scholar-!cn
ruleset=Proxies,[]GEOSITE,gfw
ruleset=Proxies,[]GEOIP,telegram,no-resolve
ruleset=Proxies,[]GEOIP,twitter,no-resolve
ruleset=Proxies,[]GEOIP,facebook,no-resolve
ruleset=Proxies,[]GEOIP,google,no-resolve

; Apple / Microsoft / Google / 雲端
ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=Proxies,[]GEOSITE,microsoft
ruleset=Proxies,[]GEOSITE,onedrive
ruleset=Proxies,[]GEOSITE,google
ruleset=Proxies,[]GEOSITE,googlefcm

; 影音
ruleset=📺 Youtube,[]GEOSITE,youtube
ruleset=🎬 Netflix,[]GEOSITE,netflix
ruleset=🎬 Netflix,[]GEOIP,netflix,no-resolve
ruleset=🌍 GlobalMedia,[]GEOSITE,disney
ruleset=🌍 GlobalMedia,[]GEOSITE,hbo
ruleset=🌍 GlobalMedia,[]GEOSITE,primevideo
ruleset=🌍 GlobalMedia,[]GEOSITE,category-emby
ruleset=🌍 GlobalMedia,[]GEOSITE,spotify
ruleset=🌍 GlobalMedia,[]GEOSITE,bahamut
ruleset=🌍 GlobalMedia,[]GEOSITE,category-media
ruleset=🌍 GlobalMedia,[]GEOSITE,category-entertainment

; 遊戲 / PT / 電商
ruleset=🎮 游戏平台,[]GEOSITE,category-games
ruleset=🎮 游戏平台,[]GEOSITE,steam
ruleset=🌍 GlobalMedia,[]GEOSITE,category-pt
ruleset=Proxies,[]GEOSITE,paypal
ruleset=Proxies,[]GEOSITE,category-ecommerce
ruleset=Proxies,[]GEOSITE,category-cryptocurrency
ruleset=Proxies,[]GEOSITE,category-speedtest

; 國外域名 / 國內兜底
ruleset=Fallback,[]GEOSITE,geolocation-!cn
ruleset=🎯 全球直连,[]GEOSITE,category-ai-cn
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

; 非標端口與最終兜底
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
ruleset=Final,[]FINAL

; ==================== 策略組 ====================

; 主入口：手動選擇 + Fallback + 地區自動測速
custom_proxy_group=Proxies`select`[]Fallback`[]🚀 HK`[]🚀 SG`[]🚀 JP`[]🚀 US`[]🚀 TW`.*`[]DIRECT
custom_proxy_group=Fallback`fallback`[]🚀 HK`[]🚀 SG`[]🚀 JP`[]🚀 US`[]🚀 TW`http://www.gstatic.com/generate_204`300

; 地區 URL-Test
custom_proxy_group=🚀 HK`url-test`港`http://www.gstatic.com/generate_204`600
custom_proxy_group=🚀 SG`url-test`新加坡|狮城`http://www.gstatic.com/generate_204`600
custom_proxy_group=🚀 TW`url-test`台|新北|彰化`http://www.gstatic.com/generate_204`600
custom_proxy_group=🚀 JP`url-test`日((?!用).)+|东京|大阪|埼玉`http://www.gstatic.com/generate_204`600
custom_proxy_group=🚀 US`url-test`美|洛杉矶|硅谷|达拉斯|费利蒙|凤凰城|芝加哥|圣何塞|西雅图`http://www.gstatic.com/generate_204`600

; 專用分流組：保持少量但保留常用場景
custom_proxy_group=🍎 Apple`select`[]DIRECT`[]Proxies`[]Fallback`[]🚀 HK`[]🚀 SG`[]🚀 JP`[]🚀 US`[]🚀 TW
custom_proxy_group=📺 Youtube`select`[]Proxies`[]Fallback`[]🚀 HK`[]🚀 US`[]🚀 SG
custom_proxy_group=🎬 Netflix`select`[]Proxies`[]Fallback`[]🚀 HK`[]🚀 SG`[]🚀 JP`[]🚀 US`[]🚀 TW`NF|Netflix|NETFLIX|原生|解锁
custom_proxy_group=🌍 GlobalMedia`select`[]Proxies`[]Fallback`[]🚀 HK`[]🚀 SG`[]🚀 JP`[]🚀 US`[]🚀 TW`[]DIRECT
custom_proxy_group=🎮 游戏平台`select`[]🎯 全球直连`[]Proxies`[]Fallback`[]🚀 HK`[]🚀 SG`[]🚀 JP`[]🚀 US`[]🚀 TW
custom_proxy_group=Final`select`[]Proxies`[]Fallback`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`https://www.gstatic.com/generate_204
